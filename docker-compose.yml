services:
  ask-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ask-frontend
    environment:
      ASK_FRONTEND_EXPOSE_PORT: ${ASK_FRONTEND_EXPOSE_PORT:-13001}
      ASK_SERVER_EMBEDDING_MODE: ${ASK_SERVER_EMBEDDING_MODE:-tei}
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "${ASK_FRONTEND_EXPOSE_PORT:-13001}:80"

  ask-server:
    build:
      context: .
      dockerfile: crates/ask-server/Dockerfile
    container_name: ask-server
    user: "1000:1000"
    command:
      - sh
      - -ceu
      - |
          if [ "${ASK_SERVER_EMBEDDING_MODE:-tei}" = "tei" ]; then
            export ASK_SERVER_EMBEDDING_BASE_URL=http://tei:80
            until wget -qO- http://tei/health >/dev/null; do
              sleep 1
            done
          elif [ "${ASK_SERVER_EMBEDDING_MODE:-tei}" = "openai" ] && [ "${ASK_USE_BUNDLED_LLAMACPP:-0}" = "1" ]; then
            # Bundled native-arm64 llama.cpp embedding server (llamacpp profile).
            export ASK_SERVER_EMBEDDING_BASE_URL=http://llamacpp:8080/v1
            until wget -qO- http://llamacpp:8080/health >/dev/null; do
              sleep 1
            done
          fi
          echo "http://localhost:${ASK_SERVER_EXPOSE_PORT:-13000}"
          exec ask-server
    environment:
      ASK_SERVER_BIND_HOST: 0.0.0.0
      ASK_SERVER_BIND_PORT: "3000"
      ASK_SERVER_EXPOSE_PORT: ${ASK_SERVER_EXPOSE_PORT:-13000}
      ASK_SERVER_DATA_DIR: /data
      ASK_SERVER_DATA_DISPLAY_DIR: ${ASK_DATA_DIR:-./.data}
      ASK_SERVER_RESOURCE_DIR: /resources
      ASK_SERVER_RESOURCE_DISPLAY_DIR: ${ASK_RESOURCE_DIR:-${ASK_SERVER_RESOURCE_DIR:-.}}
      ASK_SERVER_EMBEDDING_MODEL: ${ASK_SERVER_EMBEDDING_MODEL:-onnx-community/Qwen3-Embedding-0.6B-ONNX}
      ASK_SERVER_EMBEDDING_DIMENSIONS: ${ASK_SERVER_EMBEDDING_DIMENSIONS:-1024}
      ASK_SERVER_EMBEDDING_CHUNK_SIZE: ${ASK_SERVER_EMBEDDING_CHUNK_SIZE:-512}
      ASK_SERVER_EMBEDDING_CHUNK_OVERLAP: ${ASK_SERVER_EMBEDDING_CHUNK_OVERLAP:-0}
      ASK_SERVER_EMBEDDING_MAX_BATCH_SIZE: ${ASK_SERVER_EMBEDDING_MAX_BATCH_SIZE:-8}
      ASK_SERVER_EMBEDDING_WORKER_COUNT: ${ASK_SERVER_EMBEDDING_WORKER_COUNT:-4}
      ASK_SERVER_EMBEDDING_MODE: ${ASK_SERVER_EMBEDDING_MODE:-tei}
      ASK_SERVER_EMBEDDING_BASE_URL: ${ASK_SERVER_EMBEDDING_BASE_URL:-http://tei:80}
      ASK_SERVER_EMBEDDING_AUTH_TOKEN: ${ASK_SERVER_EMBEDDING_AUTH_TOKEN:-}
      # Compose-only: when 1 (with openai mode), target the bundled llamacpp service.
      ASK_USE_BUNDLED_LLAMACPP: ${ASK_USE_BUNDLED_LLAMACPP:-0}
    ports:
      - "${ASK_SERVER_EXPOSE_PORT:-13000}:3000"
    volumes:
      - ${ASK_DATA_DIR:-./.data}:/data
      - ${ASK_RESOURCE_DIR:-${ASK_SERVER_RESOURCE_DIR:-.}}:/resources

  # text embedding server using openai-standard api
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    platform: linux/amd64
    container_name: ask-tei-qwen3-embedding
    restart: unless-stopped
    profiles:
      - tei
    command:
      - --model-id
      - onnx-community/Qwen3-Embedding-0.6B-ONNX
      - --pooling
      - last-token
      - --max-batch-tokens
      - "2048"
      - --max-concurrent-requests
      - "64"
    ports:
      - "18080:80"
    volumes:
      - hf_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # OpenAI-compatible embedding server with native linux/arm64 support (no emulation).
  # Serves the same Qwen3-Embedding-0.6B model as the tei profile via /v1/embeddings.
  # Select with: ASK_SERVER_EMBEDDING_MODE=openai + ASK_USE_BUNDLED_LLAMACPP=1.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ask-llamacpp-qwen3-embedding
    restart: unless-stopped
    profiles:
      - llamacpp
    command:
      - -hf
      - Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      - --embeddings
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - onnx-community/Qwen3-Embedding-0.6B-ONNX
      # Memory bounds: the defaults (32k ctx, auto slots, 8 GiB prompt cache) can
      # exceed a small Docker VM and trigger OOM restarts during bulk embedding.
      # Chunks are tiny (~150 tokens) and embeddings don't reuse cache, so cap hard.
      - --ctx-size
      - "4096"
      - --parallel
      - "2"
      - --cache-ram
      - "512"
      - --no-cache-idle-slots
    ports:
      - "18080:8080"
    volumes:
      - llamacpp_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      # First boot downloads the GGUF (~640 MB); allow a long startup window.
      retries: 60
      start_period: 10s

volumes:
  hf_cache:
  llamacpp_cache:
