<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ask API Reference</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const explicitOpenApiUrl = params.get("openapi");
      const derivedOpenApiUrl = `${window.location.origin}/api-docs/openapi.json`;

      Scalar.createApiReference("#app", {
        url: explicitOpenApiUrl || derivedOpenApiUrl,
      });
    </script>
  </body>
</html>
